name: Verify LinkedIn chart sharing
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test-chart-sharing.cjs'
      - 'assets/linkedin-links.js'
      - '.github/workflows/verify-social-sharing.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve dashboard locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sharing-server.log 2>&1 &
          sleep 2
      - name: Test link buttons, deep links and OG previews
        run: node scripts/test-chart-sharing.cjs
