name: Fjern organisationsnavn fra dashboardvisning

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-org-branding.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fjern synlig organisationsbranding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = "Danske " + "A-kasser"

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          for path in ("index.html", "scripts/build_dashboard.py"):
              text = load(path)
              old = f'<div class="dak-eyebrow">{target}</div>'
              if old not in text:
                  raise RuntimeError(f"Forventet branding mangler i {path}")
              text = text.replace(old, "")
              if target in text:
                  raise RuntimeError(f"Organisationsnavnet findes stadig i {path}")
              save(path, text)

          path = "app/index.html"
          text = load(path)
          text = text.replace(target + " – Analyse", "Analyse og dashboards")
          text = text.replace(target + "s dashboards", "dashboards")
          if target in text:
              raise RuntimeError("Organisationsnavnet findes stadig i app/index.html")
          save(path, text)

          path = "app/manifest.webmanifest"
          text = load(path)
          text = text.replace(target + " – Analyse", "Analyse og dashboards")
          text = text.replace(target + "s dashboards", "dashboards")
          if target in text:
              raise RuntimeError("Organisationsnavnet findes stadig i app-manifestet")
          save(path, text)
          PY
      - name: Gem ændringen
        shell: bash
        run: |
          git config user.name "Dashboard maintenance"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html scripts/build_dashboard.py app/index.html app/manifest.webmanifest
          if git diff --cached --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Fjern organisationsnavn fra dashboard"
            git push origin HEAD:main
          fi