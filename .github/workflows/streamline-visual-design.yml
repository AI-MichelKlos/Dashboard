name: Engangsopdatering af dashboarddesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/streamline-visual-design.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strømlin design og byline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          BYLINE = 'Udarbejdet af Michel Klos@GitHub'

          def patch_index(path: Path):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  "  <style>\n    #dak-dashboard {",
                  "  <style>\n    body {margin:0; background:#f5f7f5; font-family:'Segoe UI',Arial,sans-serif; color:#0F2B36}\n    .dak-hero {background:linear-gradient(135deg,#0F2B36,#244d4b); color:#fff; padding:32px 20px}\n    .dak-hero-inner {max-width:1280px; margin:0 auto}\n    .dak-eyebrow {font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#c9dfcf}\n    .dak-hero h1 {font-size:clamp(2.1rem,4vw,3.4rem); line-height:1.08; margin:5px 0 0; color:#fff}\n    .dak-byline {font-size:.78rem; color:#c9d8d5; font-weight:600; margin-top:5px}\n    .dak-hero-sub {max-width:900px; color:#e7eeee; line-height:1.5; margin:10px 0 0}\n    #dak-dashboard {",
                  1,
              )
              text = text.replace("--navy:#13263f; --blue:#0076a8; --cyan:#42b6d5; --red:#e34a45;", "--navy:#0F2B36; --blue:#4A90C4; --cyan:#6B9E78; --red:#b14f4a;")
              text = text.replace("--green:#24895b; --orange:#ef8b2c; --purple:#7355a3; --ink:#202b38;", "--green:#6B9E78; --green-dark:#3d6b47; --orange:#E07A40; --purple:#9B59B6; --ink:#0F2B36;")
              text = text.replace("--muted:#667483; --line:#dce3e8; --paper:#fff; --soft:#f3f7f9;", "--muted:#68777d; --line:#E8EBE8; --paper:#fff; --soft:#f5f7f5;")
              text = text.replace("max-width:1280px; margin:0 auto; padding:24px; color:var(--ink);", "max-width:1280px; margin:0 auto; padding:28px 20px 55px; color:var(--ink);")
              text = text.replace("font-family:Arial,Helvetica,sans-serif;", "font-family:'Segoe UI',Arial,sans-serif;")
              text = text.replace("border-bottom:3px solid var(--blue)", "border-bottom:3px solid var(--green)")
              text = text.replace("border:1px solid var(--blue); background:#fff; color:var(--blue);", "border:1px solid var(--green-dark); background:#fff; color:var(--green-dark);")
              text = text.replace("background:var(--blue); color:#fff", "background:var(--green-dark); color:#fff")
              text = text.replace("border-top:5px solid var(--blue); border-radius:7px; padding:16px; box-shadow:0 2px 7px rgba(19,38,63,.08)", "border-top:5px solid var(--green); border-radius:12px; padding:16px; box-shadow:0 8px 28px rgba(15,43,54,.06)")
              text = text.replace("border-radius:7px; padding:18px; box-shadow:0 2px 7px rgba(19,38,63,.06)", "border-radius:12px; padding:18px; box-shadow:0 8px 28px rgba(15,43,54,.06)")
              old_head = '''<body>\n<main id="dak-dashboard">\n  <h1>Analytisk overblik - Arbejdsmarkedet</h1>\n  <p class="intro">Udvalgte nøgletal for arbejdsmarkedet, samfundsøkonomien og den internationale udvikling. Tallene opdateres i takt med de enkelte kilders offentliggørelser.</p>'''
              new_head = f'''<body>\n<header class="dak-hero"><div class="dak-hero-inner"><div class="dak-eyebrow">Danske A-kasser</div><h1>Analytisk overblik - Arbejdsmarkedet</h1><div class="dak-byline">{BYLINE}</div><p class="dak-hero-sub">Udvalgte nøgletal for arbejdsmarkedet, samfundsøkonomien og den internationale udvikling. Tallene opdateres i takt med de enkelte kilders offentliggørelser.</p></div></header>\n<main id="dak-dashboard">'''
              if old_head not in text:
                  raise RuntimeError('Kunne ikke finde dashboardets nuværende top i index.html')
              text = text.replace(old_head, new_head, 1)
              text = text.replace("const COLORS=['#0076a8','#e34a45','#24895b','#ef8b2c','#7355a3','#42b6d5','#13263f'];", "const COLORS=['#6B9E78','#E07A40','#4A90C4','#9B59B6','#3d6b47','#0F2B36'];")
              if text == original or BYLINE not in text or 'linear-gradient(135deg,#0F2B36,#244d4b)' not in text:
                  raise RuntimeError('Designændringen blev ikke anvendt på index.html')
              path.write_text(text, encoding='utf-8')

          def patch_builder(path: Path):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  "  <style>\n    #dak-dashboard {{",
                  "  <style>\n    body {{margin:0; background:#f5f7f5; font-family:'Segoe UI',Arial,sans-serif; color:#0F2B36}}\n    .dak-hero {{background:linear-gradient(135deg,#0F2B36,#244d4b); color:#fff; padding:32px 20px}}\n    .dak-hero-inner {{max-width:1280px; margin:0 auto}}\n    .dak-eyebrow {{font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#c9dfcf}}\n    .dak-hero h1 {{font-size:clamp(2.1rem,4vw,3.4rem); line-height:1.08; margin:5px 0 0; color:#fff}}\n    .dak-byline {{font-size:.78rem; color:#c9d8d5; font-weight:600; margin-top:5px}}\n    .dak-hero-sub {{max-width:900px; color:#e7eeee; line-height:1.5; margin:10px 0 0}}\n    #dak-dashboard {{",
                  1,
              )
              text = text.replace("--navy:#13263f; --blue:#0076a8; --cyan:#42b6d5; --red:#e34a45;", "--navy:#0F2B36; --blue:#4A90C4; --cyan:#6B9E78; --red:#b14f4a;")
              text = text.replace("--green:#24895b; --orange:#ef8b2c; --purple:#7355a3; --ink:#202b38;", "--green:#6B9E78; --green-dark:#3d6b47; --orange:#E07A40; --purple:#9B59B6; --ink:#0F2B36;")
              text = text.replace("--muted:#667483; --line:#dce3e8; --paper:#fff; --soft:#f3f7f9;", "--muted:#68777d; --line:#E8EBE8; --paper:#fff; --soft:#f5f7f5;")
              text = text.replace("max-width:1280px; margin:0 auto; padding:24px; color:var(--ink);", "max-width:1280px; margin:0 auto; padding:28px 20px 55px; color:var(--ink);")
              text = text.replace("font-family:Arial,Helvetica,sans-serif;", "font-family:'Segoe UI',Arial,sans-serif;")
              text = text.replace("border-bottom:3px solid var(--blue)", "border-bottom:3px solid var(--green)")
              text = text.replace("border:1px solid var(--blue); background:#fff; color:var(--blue);", "border:1px solid var(--green-dark); background:#fff; color:var(--green-dark);")
              text = text.replace("background:var(--blue); color:#fff", "background:var(--green-dark); color:#fff")
              text = text.replace("border-top:5px solid var(--blue); border-radius:7px; padding:16px; box-shadow:0 2px 7px rgba(19,38,63,.08)", "border-top:5px solid var(--green); border-radius:12px; padding:16px; box-shadow:0 8px 28px rgba(15,43,54,.06)")
              text = text.replace("border-radius:7px; padding:18px; box-shadow:0 2px 7px rgba(19,38,63,.06)", "border-radius:12px; padding:18px; box-shadow:0 8px 28px rgba(15,43,54,.06)")
              old_head = '''<body>\n<main id="dak-dashboard">\n  <h1>Analytisk overblik - Arbejdsmarkedet</h1>\n  <p class="intro">Udvalgte nøgletal for arbejdsmarkedet, samfundsøkonomien og den internationale udvikling. Tallene opdateres i takt med de enkelte kilders offentliggørelser.</p>'''
              new_head = f'''<body>\n<header class="dak-hero"><div class="dak-hero-inner"><div class="dak-eyebrow">Danske A-kasser</div><h1>Analytisk overblik - Arbejdsmarkedet</h1><div class="dak-byline">{BYLINE}</div><p class="dak-hero-sub">Udvalgte nøgletal for arbejdsmarkedet, samfundsøkonomien og den internationale udvikling. Tallene opdateres i takt med de enkelte kilders offentliggørelser.</p></div></header>\n<main id="dak-dashboard">'''
              if old_head not in text:
                  raise RuntimeError('Kunne ikke finde dashboardets nuværende top i builderen')
              text = text.replace(old_head, new_head, 1)
              text = text.replace("const COLORS=['#0076a8','#e34a45','#24895b','#ef8b2c','#7355a3','#42b6d5','#13263f'];", "const COLORS=['#6B9E78','#E07A40','#4A90C4','#9B59B6','#3d6b47','#0F2B36'];")
              if text == original or BYLINE not in text or 'linear-gradient(135deg,#0F2B36,#244d4b)' not in text:
                  raise RuntimeError('Designændringen blev ikke anvendt på builderen')
              path.write_text(text, encoding='utf-8')

          patch_builder(Path('scripts/build_dashboard.py'))
          patch_index(Path('index.html'))
          PY
      - name: Kontroller ændringen
        shell: bash
        run: |
          grep -Fq 'Udarbejdet af Michel Klos@GitHub' index.html
          grep -Fq 'Udarbejdet af Michel Klos@GitHub' scripts/build_dashboard.py
          grep -Fq 'linear-gradient(135deg,#0F2B36,#244d4b)' index.html
          python -m py_compile scripts/build_dashboard.py
      - name: Gem ændringen og fjern engangsworkflow
        shell: bash
        run: |
          rm .github/workflows/streamline-visual-design.yml
          git config user.name "ChatGPT design update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html scripts/build_dashboard.py .github/workflows/streamline-visual-design.yml
          git commit -m "Strømlin dashboarddesign og tilføj byline"
          git push origin HEAD:main
