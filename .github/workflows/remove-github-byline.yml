name: Ret byline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-github-byline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fjern GitHub fra byline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'Udarbejdet af Michel Klos@GitHub'
          new = 'Udarbejdet af Michel Klos'
          for name in ('index.html', 'scripts/build_dashboard.py'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Mangler forventet byline i {name}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Kontroller og gem
        shell: bash
        run: |
          grep -Fq 'Udarbejdet af Michel Klos' index.html
          grep -Fq 'Udarbejdet af Michel Klos' scripts/build_dashboard.py
          ! grep -Fq 'Udarbejdet af Michel Klos@GitHub' index.html
          ! grep -Fq 'Udarbejdet af Michel Klos@GitHub' scripts/build_dashboard.py
          python -m py_compile scripts/build_dashboard.py
          rm .github/workflows/remove-github-byline.yml
          git config user.name 'ChatGPT dashboard update'
          git config user.email 'dashboard-automation@users.noreply.github.com'
          git add index.html scripts/build_dashboard.py .github/workflows/remove-github-byline.yml
          git commit -m 'Ret byline til Udarbejdet af Michel Klos'
          git push origin HEAD:main
