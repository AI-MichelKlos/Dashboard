name: Frigiv fastlåst Pages-deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unblock-pages.yml"

permissions:
  contents: read
  deployments: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Markér gammel deployment som inaktiv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Engangskørsel for den fastlåste Pages-deployment fra 6. august 2026.
          response_file="$(mktemp)"
          status_code="$(curl -sS -L \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/AI-MichelKlos/Dashboard/deployments/5778005372/statuses \
            -d '{"state":"inactive","description":"Frigiver fastlåst GitHub Pages-deployment"}')"
          cat "$response_file"
          if [ "$status_code" != "201" ]; then
            echo "Kunne ikke markere deployment som inaktiv. HTTP $status_code"
            exit 1
          fi
          echo "Den fastlåste deployment er markeret som inaktiv."
