name: Opdater arbejdsmarkedsdashboard
run-name: "Arbejdsmarkedsdashboard – ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/automate-dashboard
    paths:
      - "scripts/build_dashboard.py"
      - "data/dashboard-data.json"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "15 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - name: Afgør om den planlagte kørsel skal fortsætte
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_time="$(TZ=Europe/Copenhagen date +'%Y-%m-%d %H:%M %Z')"
          local_hour="$(TZ=Europe/Copenhagen date +'%H')"
          echo "Lokal tid i København: $local_time"

          if [ "$local_hour" = "09" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: den anden UTC-plan rammer ikke kl. 09 dansk tid."
          fi

      - uses: actions/checkout@v4
        if: steps.localtime.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Verify secret configuration
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            echo "Secretet API_ADGANG mangler eller er tomt."
            exit 1
          fi

      - name: Install dependencies
        if: steps.localtime.outputs.should_run == 'true'
        run: python -m pip install pandas openpyxl

      - name: Fetch official data and build dashboard
        if: steps.localtime.outputs.should_run == 'true'
        run: python scripts/build_dashboard.py

      - name: Save updated dashboard
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          git add index.html data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "Ingen nye tal."
            exit 0
          fi
          git config user.name "Dashboard automation"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git commit -m "Opdater dashboarddata"
          git push
