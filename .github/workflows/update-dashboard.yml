name: Opdater arbejdsmarkedsdashboard
run-name: "Arbejdsmarkedsdashboard - ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/automate-dashboard
    paths:
      - "scripts/build_dashboard.py"
      - "scripts/run_dashboard_update.py"
      - "scripts/run_dashboard_update_with_inflation.py"
      - "data/dashboard-data.json"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    # Flere backupforsøg, fordi GitHub kan forsinke eller droppe enkelte cron-kørsler.
    # Dagslåsen nedenfor sikrer, at der kun gennemføres én vellykket opdatering pr. dag.
    - cron: "17 7-11 * * *"

permissions:
  contents: write

concurrency:
  group: update-labour-market-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4

      - name: Afgør om opdateringen skal gennemføres
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Kører, fordi hændelsen er ${{ github.event_name }}."
            exit 0
          fi

          today="$(TZ=Europe/Copenhagen date +'%F')"
          local_hour="$(TZ=Europe/Copenhagen date +'%H')"
          local_hour=$((10#$local_hour))
          echo "Dansk dato: $today"
          echo "Dansk time: $local_hour"

          if [ "$local_hour" -lt 9 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: backupforsøget ligger før kl. 09 dansk tid."
          elif grep -Fxq "status: ok" status/last-run.txt 2>/dev/null && \
               grep -Fxq "dato_dk: $today" status/last-run.txt 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: dashboardet er allerede opdateret i dag."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Kører dagens opdatering eller et backupforsøg efter en tidligere fejl."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Kontroller secret
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            echo "Secretet API_ADGANG mangler eller er tomt."
            exit 1
          fi

      - name: Installer afhængigheder
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install pandas openpyxl

      - name: Hent officielle data og byg dashboard
        if: steps.gate.outputs.should_run == 'true'
        id: update
        shell: bash
        run: |
          mkdir -p status
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          today="$(TZ=Europe/Copenhagen date +'%F')"
          set +e
          python -m py_compile scripts/build_dashboard.py scripts/run_dashboard_update.py scripts/run_dashboard_update_with_inflation.py > status/run.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python scripts/run_dashboard_update_with_inflation.py >> status/run.log 2>&1
            code=$?
          fi
          set -e
          cat status/run.log || true
          if [ "$code" -eq 0 ]; then
            printf 'status: ok\ntid_utc: %s\ndato_dk: %s\n' "$started" "$today" > status/last-run.txt
          else
            message="$(tail -n 12 status/run.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\ntrin: opdatering\nfejl: %s\n' "$started" "$today" "$message" > status/last-run.txt
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Kontroller dashboardfiler
        if: steps.gate.outputs.should_run == 'true' && steps.update.outputs.exit_code == '0'
        run: |
          test -s index.html
          test -s data/dashboard-data.json
          grep -q "Analytisk overblik" index.html
          grep -q "const DATA=" index.html
          grep -q "Arbejdsfordelinger under og over 13 uger" index.html
          grep -q "Opbrugt dagpengeret fordelt på dimittendstatus" index.html
          grep -q "15 stillinger med flest forgæves rekrutteringsforsøg" index.html
          grep -q '"PRIS01"' data/dashboard-data.json
          grep -q '"workSharing": "y25i06"' data/dashboard-data.json
          grep -q '"expiredBenefits": "y01ud01di"' data/dashboard-data.json
          grep -q '"failedRecruitment"' data/dashboard-data.json

      - name: Gem dashboarddata og status
        if: steps.gate.outputs.should_run == 'true' && always()
        run: |
          git add index.html data/dashboard-data.json status/last-run.txt
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git config user.name "Dashboard automation"
            git config user.email "dashboard-automation@users.noreply.github.com"
            git commit -m "Opdater dashboarddata og status"
            git push
          fi

      - name: Markér mislykket kørsel
        if: steps.gate.outputs.should_run == 'true' && steps.update.outputs.exit_code != '0'
        run: exit 1
