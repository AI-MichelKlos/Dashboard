name: Opdater arbejdsmarkedsdashboard
run-name: "Arbejdsmarkedsdashboard - ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/automate-dashboard
    paths:
      - "scripts/build_dashboard.py"
      - "scripts/run_dashboard_update.py"
      - "data/dashboard-data.json"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "15 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - name: Afgør om den planlagte kørsel skal fortsætte
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          utc_offset="$(TZ=Europe/Copenhagen date +'%z')"
          scheduled_cron="${{ github.event.schedule }}"
          echo "Planlagt cron: $scheduled_cron"
          echo "Aktuel UTC-forskydning for København: $utc_offset"

          if { [ "$scheduled_cron" = "15 7 * * 1-5" ] && [ "$utc_offset" = "+0200" ]; } || \
             { [ "$scheduled_cron" = "15 8 * * 1-5" ] && [ "$utc_offset" = "+0100" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: denne cron svarer ikke til kl. 09 dansk tid."
          fi

      - uses: actions/checkout@v4
        if: steps.localtime.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Kontroller secret
        if: steps.localtime.outputs.should_run == 'true'
        run: |
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            echo "Secretet API_ADGANG mangler eller er tomt."
            exit 1
          fi

      - name: Installer afhængigheder
        if: steps.localtime.outputs.should_run == 'true'
        run: python -m pip install pandas openpyxl

      - name: Hent officielle data og byg dashboard
        if: steps.localtime.outputs.should_run == 'true'
        id: update
        shell: bash
        run: |
          mkdir -p status
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          python -m py_compile scripts/build_dashboard.py scripts/run_dashboard_update.py > status/run.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python scripts/run_dashboard_update.py >> status/run.log 2>&1
            code=$?
          fi
          set -e
          cat status/run.log || true
          if [ "$code" -eq 0 ]; then
            printf 'status: ok\ntid_utc: %s\n' "$started" > status/last-run.txt
          else
            message="$(tail -n 12 status/run.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
            printf 'status: fejl\ntid_utc: %s\ntrin: opdatering\nfejl: %s\n' "$started" "$message" > status/last-run.txt
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Kontroller dashboardfiler
        if: steps.localtime.outputs.should_run == 'true' && steps.update.outputs.exit_code == '0'
        run: |
          test -s index.html
          test -s data/dashboard-data.json
          grep -q "Analytisk overblik" index.html
          grep -q "const DATA=" index.html

      - name: Gem dashboarddata og status
        if: steps.localtime.outputs.should_run == 'true' && always()
        run: |
          git add index.html data/dashboard-data.json status/last-run.txt
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git config user.name "Dashboard automation"
            git config user.email "dashboard-automation@users.noreply.github.com"
            git commit -m "Opdater dashboarddata og status"
            git push
          fi

      - name: Markér mislykket kørsel
        if: steps.localtime.outputs.should_run == 'true' && steps.update.outputs.exit_code != '0'
        run: exit 1
